; Ticking Bomb firmware
; One ESP32 DevKit inside the ball runs the whole game.
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ball

[env:ball]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino

; Serial monitor for debug output
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload speed. Drop to 460800 if uploads fail with a cheap cable
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3

; Libraries for parts we already have.
; Versions pinned exactly so everyone on the team builds the same thing.
; This platform ships Arduino core 2.0.17 with GCC 8.4. FastLED 3.10+ needs a
; newer compiler and fails to build here, so stay on 3.7.x until we upgrade.
lib_deps =
    fastled/FastLED@3.7.8
    madhephaestus/ESP32Encoder@0.12.0
    https://github.com/johnrickman/LiquidCrystal_I2C.git#1.1.3

; Add once the parts are confirmed or bought:
;   Accelerometer (ADXL345): adafruit/Adafruit ADXL345
;   Accelerometer (MPU-6050): adafruit/Adafruit MPU6050
;   Alphanumeric timer (if HT16K33): adafruit/Adafruit LED Backpack Library
;   MP3 module (DFPlayer Mini): dfrobot/DFRobotDFPlayerMini
